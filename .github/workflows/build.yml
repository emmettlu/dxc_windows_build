name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      dxc_ref:
        description: "DirectXShaderCompiler git ref (branch/tag/SHA)"
        required: false
        default: "main"
      toolset:
        description: "MSVC platform toolset (v142 / v143)"
        required: false
        default: "v142"
      configuration:
        description: "Build configuration"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug
      build_spirv:
        description: "Enable SPIR-V codegen"
        required: false
        default: true
        type: boolean

env:
  DXC_REPOSITORY: microsoft/DirectXShaderCompiler
  DXC_PATH: DirectXShaderCompiler
  BUILD_PATH: build
  ATLMFC_ARCHIVE: atlmfc.7z
  ATLMFC_EXTRACT_DIR: atlmfc-extract

jobs:
  build:
    name: Windows x64 ${{ github.event.inputs.toolset || 'v142' }} ${{ github.event.inputs.configuration || 'Release' }}
    runs-on: windows-2022
    timeout-minutes: 180

    defaults:
      run:
        shell: cmd

    steps:
      - name: Resolve build options
        id: opts
        shell: pwsh
        run: |
          $ref = if ("${{ github.event.inputs.dxc_ref }}") { "${{ github.event.inputs.dxc_ref }}" } else { "main" }
          $toolset = if ("${{ github.event.inputs.toolset }}") { "${{ github.event.inputs.toolset }}" } else { "v142" }
          $config = if ("${{ github.event.inputs.configuration }}") { "${{ github.event.inputs.configuration }}" } else { "Release" }
          $spirvInput = "${{ github.event.inputs.build_spirv }}"
          $spirv = if ($spirvInput -eq "" -or $spirvInput -eq "true") { "ON" } else { "OFF" }

          if ($toolset -notin @("v142", "v143")) {
            throw "Unsupported toolset: $toolset (expected v142 or v143)"
          }

          "dxc_ref=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "toolset=$toolset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "configuration=$config" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "spirv=$spirv" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_name=dxc-windows-x64-$toolset-$config" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "DXC ref:        $ref"
          Write-Host "Toolset:       $toolset"
          Write-Host "Configuration: $config"
          Write-Host "SPIR-V:        $spirv"

      # This repo holds the workflow + atlmfc.7z; DXC source is checked out separately.
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Checkout DXC
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DXC_REPOSITORY }}
          ref: ${{ steps.opts.outputs.dxc_ref }}
          path: ${{ env.DXC_PATH }}
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      # Prefer vendored atlmfc.7z over VS Installer components.
      # MSVC looks for ATL at: $(VCToolsInstallDir)atlmfc\{include,lib}
      # INCLUDE/LIB alone is insufficient for the VS generator.
      - name: Extract and install atlmfc for selected toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $toolset = "${{ steps.opts.outputs.toolset }}"
          $archive = Join-Path $env:GITHUB_WORKSPACE "${{ env.ATLMFC_ARCHIVE }}"
          if (-not (Test-Path $archive)) {
            throw "Missing ${{ env.ATLMFC_ARCHIVE }} in workflow repo root"
          }

          $extractRoot = Join-Path $env:GITHUB_WORKSPACE "${{ env.ATLMFC_EXTRACT_DIR }}"
          if (Test-Path $extractRoot) { Remove-Item -Recurse -Force $extractRoot }
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null

          Write-Host "Extracting $archive -> $extractRoot"
          & 7z x -y "-o$extractRoot" $archive | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "7z extract failed: $LASTEXITCODE" }

          $srcAtlmfc = Join-Path $extractRoot "atlmfc"
          if (-not (Test-Path (Join-Path $srcAtlmfc "include\atlbase.h"))) {
            # tolerate archive root without nested atlmfc/
            if (Test-Path (Join-Path $extractRoot "include\atlbase.h")) {
              $srcAtlmfc = $extractRoot
            } else {
              throw "atlbase.h not found after extract under $extractRoot"
            }
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio with C++ tools not found" }
          Write-Host "VS path: $vsPath"

          $msvcGlob = if ($toolset -eq "v142") { "14.29*" } else { "14.3*" }
          $msvcRoots = Get-ChildItem -Path (Join-Path $vsPath "VC\Tools\MSVC") -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like $msvcGlob } |
            Sort-Object Name -Descending

          if (-not $msvcRoots) {
            if ($toolset -eq "v142") {
              Write-Host "v142 compiler missing; installing MSVC 14.29 x64/x86 tools"
              $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
              & $installer modify `
                --installPath $vsPath `
                --add Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64 `
                --quiet --norestart --force --wait
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to install v142 compiler tools (exit $LASTEXITCODE)"
              }
              $msvcRoots = Get-ChildItem -Path (Join-Path $vsPath "VC\Tools\MSVC") -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -like $msvcGlob } |
                Sort-Object Name -Descending
            }
          }

          if (-not $msvcRoots) {
            throw "No MSVC directory matching $msvcGlob under $vsPath\VC\Tools\MSVC"
          }

          foreach ($root in $msvcRoots) {
            $dst = Join-Path $root.FullName "atlmfc"
            Write-Host "Installing ATL into: $dst"
            if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
            Copy-Item -Recurse -Force $srcAtlmfc $dst
            if (-not (Test-Path (Join-Path $dst "include\atlbase.h"))) {
              throw "atlbase.h missing after install into $dst"
            }
          }

          # Env fallback for tools that honor INCLUDE/LIB (not enough alone for VS gen)
          $includeDir = (Resolve-Path (Join-Path $msvcRoots[0].FullName "atlmfc\include")).Path
          $libDir = Join-Path $msvcRoots[0].FullName "atlmfc\lib\x64"
          if (-not (Test-Path $libDir)) { $libDir = Join-Path $msvcRoots[0].FullName "atlmfc\lib" }
          $libDir = (Resolve-Path $libDir).Path

          "INCLUDE=$includeDir;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIB=$libDir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBPATH=$libDir;$env:LIBPATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # PATH is optional for atl headers/libs; keep for any runtime helpers next to libs
          "PATH=$libDir;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "ATL include: $includeDir"
          Write-Host "ATL lib:     $libDir"

      - name: Show toolchain
        run: |
          where cmake
          cmake --version
          where python
          python --version
          where 7z
          echo INCLUDE=%INCLUDE%
          echo LIB=%LIB%

      # Inject MSVC opt flags into DXC CMakeLists after project(LLVM).
      # Strip security / debug cost flags:
      #   CMakeLists: /guard:cf, /CETCOMPAT, /INCREMENTAL:NO (+ /DEBUGTYPE)
      #   HandleLLVMOptions: Release /Zi + /DEBUG
      - name: Patch DXC CMake (opt flags, strip CF/CET/debug)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cmakeLists = Join-Path $env:GITHUB_WORKSPACE "${{ env.DXC_PATH }}\CMakeLists.txt"
          $handleOpts = Join-Path $env:GITHUB_WORKSPACE "${{ env.DXC_PATH }}\cmake\modules\HandleLLVMOptions.cmake"
          $flagsFile = Join-Path $env:GITHUB_WORKSPACE "cmake\DxcMsvcOptFlags.cmake"
          if (-not (Test-Path $cmakeLists)) { throw "Missing $cmakeLists" }
          if (-not (Test-Path $handleOpts)) { throw "Missing $handleOpts" }
          if (-not (Test-Path $flagsFile)) { throw "Missing $flagsFile" }

          $dstFlags = Join-Path $env:GITHUB_WORKSPACE "${{ env.DXC_PATH }}\cmake\DxcMsvcOptFlags.cmake"
          Copy-Item -Force $flagsFile $dstFlags

          # --- strip /guard:cf, /CETCOMPAT, /INCREMENTAL:NO from root CMakeLists ---
          $text = (Get-Content -Raw -Path $cmakeLists)
          $patterns = @(
            '(?ms)^# adjust link option to enable debugging from kernel mode; not compatible with incremental linking\r?\n' +
              'if\(NOT CMAKE_VERSION VERSION_LESS "3\.13" AND MSVC AND NOT CMAKE_C_COMPILER_ARCHITECTURE_ID STREQUAL "ARM64EC"\)\r?\n' +
              '\s*add_link_options\(/DEBUGTYPE:CV,FIXUP,PDATA /INCREMENTAL:NO\)\r?\n' +
              'endif\(\)\r?\n?',
            '(?ms)^# enable control flow guard\r?\n' +
              'if\(WIN32\)\r?\n' +
              '\s*if\(MSVC\)\r?\n' +
              '\s*add_compile_options\(/guard:cf\)\r?\n' +
              '\s*add_link_options\(/guard:cf\)\r?\n' +
              '\s*else\(\)\r?\n' +
              '\s*add_compile_options\(-fcf-protection\)\r?\n' +
              '\s*endif\(\)\r?\n' +
              'endif\(WIN32\)\r?\n?',
            '(?ms)^# Enable CET Shadow Stack\r?\n' +
              'if\(MSVC AND NOT \(CMAKE_C_COMPILER_ARCHITECTURE_ID MATCHES "ARM\.\*"\)\)\r?\n' +
              '\s*add_link_options\(/CETCOMPAT\)\r?\n' +
              'endif\(\)\r?\n?'
          )
          foreach ($p in $patterns) {
            $before = $text.Length
            $text = [regex]::Replace($text, $p, "")
            if ($text.Length -lt $before) { Write-Host "Stripped CMakeLists security/debug block" }
            else { Write-Host "WARNING: CMakeLists pattern not found" }
          }
          $text = [regex]::Replace($text, '(?m)^\s*add_compile_options\(/guard:cf\)\s*\r?\n', '')
          $text = [regex]::Replace($text, '(?m)^\s*add_link_options\(/guard:cf\)\s*\r?\n', '')
          $text = [regex]::Replace($text, '(?m)^\s*add_link_options\(/CETCOMPAT\)\s*\r?\n', '')
          $text = [regex]::Replace($text, '(?m)^\s*add_link_options\(/DEBUGTYPE:CV,FIXUP,PDATA /INCREMENTAL:NO\)\s*\r?\n', '')

          $lines = [System.Collections.Generic.List[string]]($text -split "\n", [System.StringSplitOptions]::None)

          if (-not ($lines -match 'DxcMsvcOptFlags\.cmake')) {
            $markerIdx = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i].Trim() -eq 'project(LLVM)') { $markerIdx = $i; break }
            }
            if ($markerIdx -lt 0) { throw "Could not find project(LLVM) in CMakeLists.txt" }
            $insert = @(
              ''
              '# --- begin dxc_windows_build MSVC opt flags (injected by CI) ---'
              'include(${CMAKE_CURRENT_SOURCE_DIR}/cmake/DxcMsvcOptFlags.cmake)'
              '# --- end dxc_windows_build MSVC opt flags ---'
              ''
            )
            $lines.InsertRange($markerIdx + 1, $insert)
            Write-Host "Injected DxcMsvcOptFlags.cmake after project(LLVM)"
          }

          Set-Content -Path $cmakeLists -Value $lines -Encoding utf8NoBOM

          # --- strip Release /Zi + /DEBUG from HandleLLVMOptions.cmake ---
          $ho = Get-Content -Raw -Path $handleOpts
          $hoPattern = '(?ms)^\s*# Change release to always build debug information out-of-line, but\r?\n' +
            '\s*# also enable Reference optimization, ie dead function elimination\.\r?\n' +
            '\s*if \(NOT CMAKE_MSVC_DEBUG_INFORMATION_FORMAT\)\r?\n' +
            '\s*append\("/Zi" CMAKE_CXX_FLAGS_RELEASE\)\r?\n' +
            '\s*append\("/DEBUG /OPT:REF" CMAKE_SHARED_LINKER_FLAGS_RELEASE\)\r?\n' +
            '\s*append\("/DEBUG /OPT:REF" CMAKE_EXE_LINKER_FLAGS_RELEASE\)\r?\n' +
            '\s*endif\(\)\r?\n?'
          # Avoid PowerShell here-strings in YAML run blocks: terminator must be
          # column-0 which breaks YAML indentation of `run: |`.
          $hoReplacement = (
            '  # dxc_windows_build: PDB stripped for size. Keep /OPT:REF only.',
            '  append("/OPT:REF" CMAKE_SHARED_LINKER_FLAGS_RELEASE)',
            '  append("/OPT:REF" CMAKE_EXE_LINKER_FLAGS_RELEASE)',
            ''
          ) -join "`n"
          $hoNew = [regex]::Replace($ho, $hoPattern, $hoReplacement)
          if ($hoNew -eq $ho) {
            Write-Host "WARNING: HandleLLVMOptions /Zi block pattern not found; applying line fallbacks"
            $hoNew = [regex]::Replace($ho, '(?m)^\s*append\("/Zi" CMAKE_CXX_FLAGS_RELEASE\)\s*\r?\n', '')
            $hoNew = [regex]::Replace($hoNew, '(?m)^\s*append\("/DEBUG /OPT:REF" CMAKE_SHARED_LINKER_FLAGS_RELEASE\)\s*\r?\n',
              "  append(`"/OPT:REF`" CMAKE_SHARED_LINKER_FLAGS_RELEASE)`n")
            $hoNew = [regex]::Replace($hoNew, '(?m)^\s*append\("/DEBUG /OPT:REF" CMAKE_EXE_LINKER_FLAGS_RELEASE\)\s*\r?\n',
              "  append(`"/OPT:REF`" CMAKE_EXE_LINKER_FLAGS_RELEASE)`n")
          } else {
            Write-Host "Patched HandleLLVMOptions Release PDB block"
          }
          Set-Content -Path $handleOpts -Value $hoNew -Encoding utf8NoBOM

          # late scrub via ENDS_INCLUDE after all flags settled (no here-string)
          $scrub = (
            '# dxc_windows_build: final scrub of PDB/debug flags after HandleLLVMOptions',
            'if(MSVC)',
            '  macro(_dxc_wb_scrub v)',
            '    if(DEFINED ${v})',
            '      string(REGEX REPLACE "(^| )[/-]Z[iI7]( |$)" " " ${v} "${${v}}")',
            '      string(REGEX REPLACE "(^| )[/-]DEBUG(:[^ ]*)?( |$)" " " ${v} "${${v}}")',
            '      string(REGEX REPLACE "  +" " " ${v} "${${v}}")',
            '      string(STRIP "${${v}}" ${v})',
            '    endif()',
            '  endmacro()',
            '  foreach(_v',
            '      CMAKE_C_FLAGS_RELEASE CMAKE_CXX_FLAGS_RELEASE',
            '      CMAKE_EXE_LINKER_FLAGS_RELEASE CMAKE_SHARED_LINKER_FLAGS_RELEASE',
            '      CMAKE_MODULE_LINKER_FLAGS_RELEASE)',
            '    _dxc_wb_scrub(${_v})',
            '  endforeach()',
            '  set(CMAKE_CXX_FLAGS_RELEASE "${CMAKE_CXX_FLAGS_RELEASE}" CACHE STRING "" FORCE)',
            '  set(CMAKE_C_FLAGS_RELEASE "${CMAKE_C_FLAGS_RELEASE}" CACHE STRING "" FORCE)',
            '  set(CMAKE_EXE_LINKER_FLAGS_RELEASE "${CMAKE_EXE_LINKER_FLAGS_RELEASE} /DEBUG:NONE /OPT:REF /OPT:ICF" CACHE STRING "" FORCE)',
            '  set(CMAKE_SHARED_LINKER_FLAGS_RELEASE "${CMAKE_SHARED_LINKER_FLAGS_RELEASE} /DEBUG:NONE /OPT:REF /OPT:ICF" CACHE STRING "" FORCE)',
            '  message(STATUS "dxc_windows_build: final PDB scrub applied")',
            'endif()'
          ) -join "`n"
          $scrubPath = Join-Path $env:GITHUB_WORKSPACE "${{ env.DXC_PATH }}\cmake\DxcMsvcEndsScrub.cmake"
          Set-Content -Path $scrubPath -Value $scrub -Encoding utf8NoBOM

          Write-Host "--- verify root CMakeLists ---"
          Select-String -Path $cmakeLists -Pattern 'DxcMsvcOptFlags|guard:cf|CETCOMPAT|INCREMENTAL:NO|DEBUGTYPE' |
            ForEach-Object { Write-Host ("{0}: {1}" -f $_.LineNumber, $_.Line.Trim()) }
          if (Select-String -Path $cmakeLists -Pattern 'add_(compile|link)_options\(/(guard:cf|CETCOMPAT)|INCREMENTAL:NO') {
            throw "Still found stripped flags in CMakeLists.txt"
          }
          Write-Host "--- verify HandleLLVMOptions ---"
          Select-String -Path $handleOpts -Pattern '"/Zi"|"/DEBUG' |
            ForEach-Object { Write-Host ("{0}: {1}" -f $_.LineNumber, $_.Line.Trim()) }

      # PredefinedParams.cmake forces HLSL_INCLUDE_TESTS/SPIRV_BUILD_TESTS ON via
      # CACHE. Command-line -D is applied before -C and is not overwritten without
      # FORCE, so overrides must be present.
      #
      # DXC Windows test CMake hard-depends check-* targets on ExecHLSLTests /
      # dxc_batch / ClangHLSLTests. Those targets are only created when
      # HLSL_INCLUDE_TESTS=ON. Turning only HLSL tests OFF while leaving
      # LLVM/CLANG tests ON leaves dangling DEPENDS and breaks generate.
      - name: Configure (CMake + VS2022 + toolset)
        working-directory: ${{ env.DXC_PATH }}
        run: |
          cmake -S . -B ..\${{ env.BUILD_PATH }} ^
            -G "Visual Studio 17 2022" ^
            -A x64 ^
            -T ${{ steps.opts.outputs.toolset }} ^
            -DLLVM_INCLUDE_TESTS=OFF ^
            -DCLANG_INCLUDE_TESTS=OFF ^
            -DHLSL_INCLUDE_TESTS=OFF ^
            -DSPIRV_BUILD_TESTS=OFF ^
            -DENABLE_SPIRV_CODEGEN=${{ steps.opts.outputs.spirv }} ^
            -DLLVM_ENABLE_ASSERTIONS=OFF ^
            -DDXC_CMAKE_ENDS_INCLUDE=%CD%\cmake\DxcMsvcEndsScrub.cmake ^
            -DCMAKE_SYSTEM_VERSION=10.0.26100.0 ^
            -C cmake\caches\PredefinedParams.cmake

      - name: Build
        run: |
          cmake --build ${{ env.BUILD_PATH }} --config ${{ steps.opts.outputs.configuration }} --parallel --target dxc dxcompiler dxv dxildll

      - name: Stage binaries
        id: stage
        shell: pwsh
        run: |
          $config = "${{ steps.opts.outputs.configuration }}"
          $candidates = @(
            "${{ env.BUILD_PATH }}\$config\bin",
            "${{ env.BUILD_PATH }}\bin\$config",
            "${{ env.BUILD_PATH }}\$config",
            "${{ env.BUILD_PATH }}\bin"
          )

          $binDir = $null
          foreach ($c in $candidates) {
            if (Test-Path (Join-Path $c "dxc.exe")) {
              $binDir = (Resolve-Path $c).Path
              break
            }
          }
          if (-not $binDir) {
            Write-Host "Search results:"
            Get-ChildItem -Path "${{ env.BUILD_PATH }}" -Recurse -Filter "dxc.exe" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName }
            throw "dxc.exe not found under ${{ env.BUILD_PATH }}"
          }

          $stage = Join-Path $env:GITHUB_WORKSPACE "artifact\dxc"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $required = @("dxc.exe", "dxcompiler.dll")
          $optional = @("dxv.exe", "dxil.dll", "dxcompiler.lib", "dxcompiler.pdb", "dxc.pdb")

          foreach ($f in $required) {
            $src = Join-Path $binDir $f
            if (-not (Test-Path $src)) { throw "Required file missing: $src" }
            Copy-Item $src $stage
          }
          foreach ($f in $optional) {
            $src = Join-Path $binDir $f
            if (Test-Path $src) { Copy-Item $src $stage }
          }

          $info = @(
            "repository=${{ env.DXC_REPOSITORY }}",
            "ref=${{ steps.opts.outputs.dxc_ref }}",
            "toolset=${{ steps.opts.outputs.toolset }}",
            "configuration=$config",
            "spirv=${{ steps.opts.outputs.spirv }}",
            "runner=$env:ImageOS $env:ImageVersion"
          )
          $info | Set-Content -Path (Join-Path $stage "build-info.txt") -Encoding utf8

          Write-Host "Staged from: $binDir"
          Get-ChildItem $stage | Format-Table Name, Length

          "bin_dir=$binDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "stage_dir=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Smoke test
        shell: pwsh
        run: |
          $dxc = Join-Path "${{ steps.stage.outputs.stage_dir }}" "dxc.exe"
          & $dxc -help
          if ($LASTEXITCODE -ne 0) { throw "dxc -help failed" }

          # No here-string (YAML indent breaks "@ terminator).
          $hlsl = "float4 main() : SV_Target { return float4(1, 0, 0, 1); }`n"
          $src = Join-Path $env:RUNNER_TEMP "smoke.hlsl"
          $out = Join-Path $env:RUNNER_TEMP "smoke.dxil"
          Set-Content -Path $src -Value $hlsl -Encoding ascii
          & $dxc -T ps_6_0 -E main $src -Fo $out
          if ($LASTEXITCODE -ne 0) { throw "dxc smoke compile failed" }
          if (-not (Test-Path $out)) { throw "smoke output missing" }
          Write-Host "Smoke compile OK: $out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.opts.outputs.artifact_name }}
          path: artifact/dxc/**
          if-no-files-found: error
          retention-days: 30
